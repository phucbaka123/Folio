name: Release

# Pushing a tag like v1.0.0 builds the installer, the portable exe and TitleBarStyler,
# and attaches them to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Folio (installer + portable)
        run: npm run dist

      - name: Build TitleBarStyler
        shell: powershell
        run: ./tools/TitleBarStyler/build.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: folio-windows
          path: |
            dist/Folio-Setup-*.exe
            dist/Folio-*-portable.exe
            tools/TitleBarStyler/bin/TitleBarStyler.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Folio-Setup-*.exe
            dist/Folio-*-portable.exe
            tools/TitleBarStyler/bin/TitleBarStyler.exe
